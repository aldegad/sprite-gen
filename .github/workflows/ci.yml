# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test one Python version; the installable minimum is declared separately
        # in pyproject.toml. Keep the tested version documented in README.md.
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install the pipeline's required binaries (ffmpeg for video-frames, libwebp >= 1.5 for video-loop -exact)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -fsSL https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0-linux-x86-64.tar.gz | tar -xz -C /tmp
          sudo cp /tmp/libwebp-1.6.0-linux-x86-64/bin/* /usr/local/bin/
          img2webp -h 2>&1 | grep -q -- -exact   # img2webp -version exits 1 without an output file; -h is the honest probe

      - name: Install RIFE for video-loop's jump repair (rife-ncnn-vulkan 20221029 on Mesa llvmpipe, docs/loop-repair.md)
        run: |
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers unzip
          curl -fsSL -o /tmp/rife.zip https://github.com/nihui/rife-ncnn-vulkan/releases/download/20221029/rife-ncnn-vulkan-20221029-ubuntu.zip
          echo '1e2c7ee7fa7daa326542d50622f0afedc80cf6f1858bda411d16385ffa5cdf68  /tmp/rife.zip' | sha256sum -c -
          sudo unzip -q /tmp/rife.zip -d /opt
          sudo ln -s /opt/rife-ncnn-vulkan-20221029-ubuntu/rife-ncnn-vulkan /usr/local/bin/rife-ncnn-vulkan

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (clean environment, as the quickstart does)
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Quickstart smoke (prepare -> extract -> compose)
        run: |
          .venv/bin/python scripts/prepare_sprite_run.py --help > /dev/null
          cp -r tests/fixtures/run /tmp/smoke-run
          .venv/bin/python scripts/extract_sprite_row_frames.py --run-dir /tmp/smoke-run
          .venv/bin/python scripts/compose_sprite_atlas.py --run-dir /tmp/smoke-run
          test -f /tmp/smoke-run/sprite-sheet-alpha.png
          test -f /tmp/smoke-run/manifest.json

      - name: Tests
        run: .venv/bin/python -m pytest -q
